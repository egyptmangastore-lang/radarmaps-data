name: Weekly radar & bump update

on:
  schedule:
    - cron: "0 3 * * 5"   # every Friday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyosmium
        run: pip install osmium
      - name: Download Egypt extract (Geofabrik)
        run: |
          base=https://download.geofabrik.de/africa/egypt
          get() { curl -sSfL --retry 3 --retry-all-errors --retry-delay 30 -A "radarmaps-data-weekly" -o egypt.osm.pbf "$1"; }
          # "latest" sometimes points to a file that isn't published yet, so fall back to the last dated ones
          if get "$base/egypt-latest.osm.pbf"; then exit 0; fi
          for d in 1 2 3 4 5 6 7; do
            f="egypt-$(date -u -d "-$d day" +%y%m%d).osm.pbf"
            echo "trying $f"
            if get "$base/$f"; then exit 0; fi
          done
          echo "no Egypt extract available"; exit 1
      - name: Extract speed cameras and bumps
        run: python -I tools/extract_hazards.py egypt.osm.pbf hazards_eg.json
      - name: Commit if changed
        run: |
          rm -f egypt.osm.pbf
          git config user.name "radarmaps-bot"
          git config user.email "radarmaps-bot@users.noreply.github.com"
          git add hazards_eg.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Weekly update $(date -u +%F)"
          git push
